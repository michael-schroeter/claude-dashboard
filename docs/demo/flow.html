<!DOCTYPE html>
<!-- The animated README demo (docs/demo.gif): a session in another window starts
     waiting, one click on its card brings that window to the front with the
     session open. Every frame is a pure function of the time in the address,
     e.g. flow.html#t=3.4, so render-gif.sh can render each frame on its own.
     An illustration with made-up projects, not a screen recording. The
     dashboard inside is the extension's real code (flow-frame.html). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Dashboard demo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1100px; height: 720px; overflow: hidden; }
  body {
    position: relative;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #ccc;
    -webkit-font-smoothing: antialiased;
    /* Calm wallpaper: few, broad gradients keep the GIF palette clean. */
    background:
      radial-gradient(70% 90% at 90% 0%, #3a3270 0%, transparent 70%),
      radial-gradient(60% 80% at 0% 100%, #18414f 0%, transparent 70%),
      #1d2141;
  }

  /* ---- Desktop ---- */
  .menubar { position: absolute; inset: 0 0 auto 0; height: 26px; display: flex; align-items: center;
    padding: 0 14px; gap: 17px; font-size: 13px; color: #fff; background: rgba(12, 14, 30, .45); z-index: 20; }
  .menubar b { font-weight: 700; }
  .menubar .right { margin-left: auto; display: flex; align-items: center; gap: 15px; }
  .menubar svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 1.7; }
  .menubar .me { display: flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; }
  .menubar .me svg { width: 17px; height: 17px; stroke-width: 1.35; }

  .caption { position: absolute; left: 0; right: 0; bottom: 10px; height: 32px; display: flex;
    justify-content: center; z-index: 20; }
  .caption span { display: flex; align-items: center; gap: 9px; padding: 0 16px 0 7px; border-radius: 99px;
    background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .14);
    color: #fff; font-size: 14px; font-weight: 500; letter-spacing: .01em; }
  .caption i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    background: #fff; color: #1d2141; font-size: 12px; font-weight: 700; }

  /* ---- Windows ---- */
  .window { position: absolute; width: 960px; height: 616px; display: flex; flex-direction: column;
    background: #181818; border-radius: 11px; overflow: hidden;
    box-shadow: 0 22px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .13); }
  #winA { left: 20px; top: 40px; }
  #winB { left: 120px; top: 50px; }
  .titlebar { height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border-bottom: 1px solid #2b2b2b; }
  .light { width: 12px; height: 12px; border-radius: 50%; }
  .inactive .light { background: #4a4a4a !important; }
  .titlebar .name { flex: 1; text-align: center; color: #9d9d9d; font-size: 12px; margin-right: 52px; }
  .inactive .titlebar .name { color: #6b6b6b; }
  .body { flex: 1; display: flex; min-height: 0; }
  .activity { width: 48px; flex: none; border-right: 1px solid #2b2b2b; display: flex; flex-direction: column;
    align-items: center; padding-top: 10px; gap: 20px; }
  .activity svg { width: 24px; height: 24px; stroke: #868686; fill: none; stroke-width: 1.6; }
  .activity .on { position: relative; }
  .activity .on svg { stroke: #d7d7d7; }
  .activity .on::before { content: ""; position: absolute; left: -12px; top: -6px; bottom: -6px; width: 2px; background: #0078d4; }
  .editor { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #1f1f1f; }
  .tabs { height: 35px; flex: none; display: flex; background: #181818; border-bottom: 1px solid #2b2b2b; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #1f1f1f; color: #fff;
    border-right: 1px solid #2b2b2b; border-top: 1px solid #0078d4; }
  .tab .x { color: #9d9d9d; margin-left: 6px; }
  .tab .mark { width: 12px; height: 12px; border-radius: 3px; background: #d97757; }
  .tab .py { color: #e5c07b; font: 600 10px/1 Menlo, monospace; }
  iframe { flex: 1; border: 0; width: 100%; display: block; background: #1f1f1f; }
  .status { height: 22px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 10px;
    border-top: 1px solid #2b2b2b; font-size: 12px; color: #bbb; }
  .status .item { display: flex; align-items: center; gap: 5px; }
  .status .grid { width: 11px; height: 11px; border: 1.3px solid #bbb; border-radius: 2px;
    background: linear-gradient(#bbb, #bbb) center/1.3px 100% no-repeat; }
  .status .end { margin-left: auto; }

  /* Code editor in the weather-station window */
  .code { flex: 1; padding: 10px 0; font: 12px/19px Menlo, "SF Mono", monospace; color: #cccccc; white-space: pre; overflow: hidden; }
  .code .ln { display: inline-block; width: 42px; padding-right: 14px; text-align: right; color: #6e7681; }
  .code .cur { background: #2a2d2e; }
  .k { color: #c586c0; } .f { color: #dcdcaa; } .s { color: #ce9178; } .v { color: #9cdcfe; } .c { color: #4ec9b0; }

  /* A generic chat panel (stand-in for the Claude Code extension) */
  .chat { width: 380px; flex: none; display: flex; flex-direction: column; background: #181818; border-left: 1px solid #2b2b2b; }
  .chat-head { height: 35px; flex: none; display: flex; align-items: center; padding: 0 14px; gap: 8px;
    border-bottom: 1px solid #2b2b2b; font-size: 11px; letter-spacing: .05em; color: #bbb; }
  .chat-head .session { margin-left: auto; display: flex; align-items: center; gap: 6px; max-width: 220px;
    letter-spacing: 0; font-size: 12px; color: #e0e0e0; }
  .chat-head .session span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-head .session svg { width: 10px; height: 10px; flex: none; fill: none; stroke: #9d9d9d; stroke-width: 1.6; }
  .messages { flex: 1; min-height: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 11px;
    justify-content: flex-end; overflow: hidden; line-height: 1.5; }
  .me-msg { align-self: flex-end; max-width: 85%; padding: 8px 12px; border-radius: 12px; background: #2c2f36; color: #e8e8e8; }
  .ai { color: #d4d4d4; }
  .ai b { color: #fff; font-weight: 600; }
  .ai code { font: 11.5px Menlo, monospace; padding: 1px 4px; border-radius: 4px; background: #262626; color: #e0e0e0; }
  .tool { font-size: 12px; color: #8b8b8b; display: flex; align-items: center; gap: 6px; }
  .tool::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #5a5a5a; }
  .ai ol { margin: 4px 0 0; padding-left: 20px; }
  .busy { font-size: 12px; color: #3fb950; display: flex; align-items: center; gap: 6px; }
  .busy::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3fb950; }
  .input { margin: 0 12px 12px; height: 42px; flex: none; border-radius: 9px; border: 1px solid #3c3c3c;
    background: #1f1f1f; display: flex; align-items: center; padding: 0 12px; color: #6f6f6f; position: relative; }
  .input.focus { border-color: #0078d4; box-shadow: 0 0 0 1px #0078d4; }
  .input .caret { width: 1.5px; height: 17px; background: #e8e8e8; margin-right: 1px; }
  .input .send { position: absolute; right: 8px; top: 8px; width: 24px; height: 24px; border-radius: 7px;
    background: #2f2f2f; display: grid; place-items: center; }
  .input .send svg { width: 12px; height: 12px; fill: none; stroke: #8b8b8b; stroke-width: 2; }

  /* ---- Mouse ---- */
  #cursor { position: absolute; width: 22px; height: 30px; z-index: 30; transform-origin: 3px 2px; }
  .ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .9); z-index: 29;
    background: rgba(255, 255, 255, .12); }
</style>
</head>
<body>
  <div class="menubar">
    <b>Code</b><span>File</span><span>Edit</span><span>Selection</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    <div class="right">
      <span class="me">
        <svg viewBox="0 0 18 18" stroke-linecap="round"><rect x="2.7" y="5.2" width="12.6" height="8.2" rx="2.6"/><path d="M9 5.2V3.4M6.6 8.3v1.8M11.4 8.3v1.8M6 13.4v2.2M12 13.4v2.2"/><circle cx="9" cy="2.45" r=".95" stroke-width="1.1"/></svg>
        <span id="count">2</span>
      </span>
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L14 14"/></svg>
      <svg viewBox="0 0 16 16"><rect x="1.5" y="3" width="13" height="4" rx="2"/><rect x="1.5" y="9" width="13" height="4" rx="2"/></svg>
      <span>Fri 13 Nov&nbsp;&nbsp;10:42</span>
    </div>
  </div>

  <!-- The window with the dashboard (project recipe-book) -->
  <div class="window" id="winA">
    <div class="titlebar">
      <span class="light" style="background:#ff5f57"></span>
      <span class="light" style="background:#febc2e"></span>
      <span class="light" style="background:#28c840"></span>
      <span class="name">recipe-book</span>
    </div>
    <div class="body">
      <div class="activity">
        <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="7" cy="5.5" r="2.2"/><circle cx="7" cy="18.5" r="2.2"/><circle cx="17" cy="9" r="2.2"/><path d="M7 7.7v8.6M17 11.2c0 3-3 3.6-10 5.1"/></svg>
        <span class="on"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>
      </div>
      <div class="editor">
        <div class="tabs"><div class="tab"><span class="mark"></span>Claude Dashboard<span class="x">×</span></div></div>
        <iframe id="dashboard" title="Claude Dashboard"></iframe>
      </div>
    </div>
    <div class="status">
      <span class="item"><span class="grid"></span>Claude Dashboard</span>
      <span class="item">main</span>
    </div>
  </div>

  <!-- The window in which the session runs (project weather-station) -->
  <div class="window" id="winB">
    <div class="titlebar">
      <span class="light" style="background:#ff5f57"></span>
      <span class="light" style="background:#febc2e"></span>
      <span class="light" style="background:#28c840"></span>
      <span class="name">weather-station</span>
    </div>
    <div class="body">
      <div class="activity">
        <span class="on"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg></span>
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="7" cy="5.5" r="2.2"/><circle cx="7" cy="18.5" r="2.2"/><circle cx="17" cy="9" r="2.2"/><path d="M7 7.7v8.6M17 11.2c0 3-3 3.6-10 5.1"/></svg>
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      </div>
      <div class="editor">
        <div class="tabs"><div class="tab"><span class="py">py</span>export.py<span class="x">×</span></div></div>
        <div class="code" id="code"></div>
      </div>
      <div class="chat">
        <div class="chat-head">CLAUDE CODE
          <span class="session"><span id="sessionTitle"></span><svg viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3"/></svg></span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input" id="input"><span class="caret" id="caret"></span><span id="placeholder">Reply …</span>
          <span class="send"><svg viewBox="0 0 12 12"><path d="M6 10V2M2.5 5.5L6 2l3.5 3.5"/></svg></span></div>
      </div>
    </div>
    <div class="status">
      <span class="item"><span class="grid"></span>Claude Dashboard</span>
      <span class="item">main</span>
      <span class="item end">Ln 14, Col 9&nbsp;&nbsp;&nbsp;Python</span>
    </div>
  </div>

  <div class="caption"><span id="caption"></span></div>
  <svg id="cursor" viewBox="0 0 22 30"><path d="M3 2v21l5.2-5 3.4 8 3.4-1.5-3.4-7.8H19z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>

<script>
  // ---- Timeline (seconds) ------------------------------------------------
  const T = {
    waiting: 1.8,      // the session in weather-station starts waiting
    move1: [2.7, 3.5], // mouse to its card
    press: 3.6,        // click
    front: 3.78,       // weather-station window comes to the front
    session: 4.15,     // and the session opens there
    move2: [4.5, 5.2], // mouse to the reply box
    focus: 5.25,       // reply box gets the focus, caret blinks
  };
  const t = parseFloat(new URLSearchParams(location.hash.slice(1)).get('t') || '0');

  // Positions on the 1100 × 720 page. The card is "Fix time zone in the export"
  // in "Now" (measured with flow-frame.html#s=waiting&measure=1, iframe at 68/109).
  const CARD = { x: 68 + 318.7, y: 109 + 132.3, w: 274.7, h: 60.5 };
  const START = { x: 820, y: 345 };
  const CLICK = { x: 474, y: 262 };
  const INPUT = { x: 846, y: 612 };

  const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const clamp = (u) => Math.max(0, Math.min(1, u));
  const lerp = (a, b, u) => ({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u });
  const along = (a, b, [t0, t1]) => {
    const u = ease(clamp((t - t0) / (t1 - t0)));
    // A slight arc, like a hand moves a mouse.
    const p = lerp(a, b, u);
    const lift = Math.sin(u * Math.PI) * 26;
    return { x: p.x, y: p.y - lift };
  };

  const waiting = t >= T.waiting;
  const front = t >= T.front ? 'B' : 'A';
  const sessionOpen = t >= T.session;

  let mouse = START;
  if (t >= T.move1[0]) mouse = along(START, CLICK, T.move1);
  if (t >= T.move2[0]) mouse = along(CLICK, INPUT, T.move2);
  const overCard = front === 'A' && mouse.x >= CARD.x && mouse.x <= CARD.x + CARD.w &&
    mouse.y >= CARD.y && mouse.y <= CARD.y + CARD.h;

  // ---- Desktop ----
  document.getElementById('count').textContent = waiting ? '1' : '2';
  const captions = [
    [0, '1', 'All Claude Code sessions of all windows in one tab'],
    [T.waiting, '2', 'A session in another window is waiting for you'],
    [T.press, '3', 'One click: the right window, the right session'],
  ];
  const caption = captions.filter(([from]) => t >= from).pop();
  document.getElementById('caption').innerHTML = '<i>' + caption[1] + '</i>' + caption[2];

  // ---- Windows ----
  const winA = document.getElementById('winA');
  const winB = document.getElementById('winB');
  winA.style.zIndex = front === 'A' ? 2 : 1;
  winB.style.zIndex = front === 'B' ? 2 : 1;
  winA.classList.toggle('inactive', front !== 'A');
  winB.classList.toggle('inactive', front !== 'B');
  document.getElementById('dashboard').src =
    'flow-frame.html#s=' + (waiting ? 'waiting' : 'working') + (overCard ? '&hover=1' : '');

  // ---- Code in the weather-station window ----
  const code = [
    '<span class="k">import</span> csv',
    '<span class="k">from</span> datetime <span class="k">import</span> <span class="c">datetime</span>',
    '',
    '<span class="k">from</span> .sensors <span class="k">import</span> <span class="f">read_all</span>',
    '',
    '',
    '<span class="k">def</span> <span class="f">export</span>(<span class="v">path</span>):',
    '    <span class="v">rows</span> = <span class="f">read_all</span>()',
    '    <span class="k">with</span> <span class="f">open</span>(<span class="v">path</span>, <span class="s">"w"</span>, <span class="v">newline</span>=<span class="s">""</span>) <span class="k">as</span> <span class="v">file</span>:',
    '        <span class="v">writer</span> = csv.<span class="f">writer</span>(<span class="v">file</span>)',
    '        <span class="v">writer</span>.<span class="f">writerow</span>([<span class="s">"time"</span>, <span class="s">"temp"</span>, <span class="s">"humidity"</span>])',
    '        <span class="k">for</span> <span class="v">row</span> <span class="k">in</span> <span class="v">rows</span>:',
    '            <span class="v">stamp</span> = <span class="c">datetime</span>.<span class="f">fromtimestamp</span>(<span class="v">row</span>.ts)',
    '            <span class="v">writer</span>.<span class="f">writerow</span>([<span class="v">stamp</span>, <span class="v">row</span>.temp, <span class="v">row</span>.hum])',
    '',
  ];
  document.getElementById('code').innerHTML = code
    .map((line, i) => '<div' + (i === 12 ? ' class="cur"' : '') + '><span class="ln">' + (i + 1) + '</span>' + line + '</div>')
    .join('');

  // ---- Chat panel ----
  const SESSIONS = {
    humidity: {
      title: 'Add humidity sensor to the dashboard',
      html:
        '<div class="me-msg">Add the humidity sensor to the dashboard chart.</div>' +
        '<div class="tool">Edited chart.py</div>' +
        '<div class="ai">I added a second series for the humidity sensor, with its own axis on the right.</div>' +
        '<div class="tool">Ran the tests</div>' +
        '<div class="ai">The chart now shows both series. I am running the tests once more.</div>' +
        '<div class="busy">Working …</div>',
    },
    timezone: {
      title: 'Fix time zone in the export',
      html:
        '<div class="me-msg">The exported times are one hour off. Can you fix the export?</div>' +
        '<div class="tool">Read export.py</div>' +
        '<div class="ai">Found it: <code>export.py</code> writes the times without a time zone, so they shift ' +
        'by an hour on another computer. Two ways to fix it:' +
        '<ol><li>Local time with offset: <code>10:42+01:00</code></li><li>UTC: <code>09:42Z</code></li></ol></div>' +
        '<div class="ai"><b>Should the export use local time or UTC?</b></div>',
    },
  };
  const session = SESSIONS[sessionOpen ? 'timezone' : 'humidity'];
  document.getElementById('sessionTitle').textContent = session.title;
  document.getElementById('messages').innerHTML = session.html;

  const focused = t >= T.focus;
  const caretOn = focused && Math.floor((t - T.focus) / 0.5) % 2 === 0;
  document.getElementById('input').classList.toggle('focus', focused);
  document.getElementById('caret').style.visibility = caretOn ? 'visible' : 'hidden';

  // ---- Mouse ----
  const cursor = document.getElementById('cursor');
  cursor.style.left = mouse.x - 3 + 'px';
  cursor.style.top = mouse.y - 2 + 'px';
  const pressed = (t >= T.press && t < T.press + 0.12) || (t >= T.move2[1] && t < T.move2[1] + 0.1);
  if (pressed) cursor.style.transform = 'scale(.86)';

  // A ring where the mouse clicked, growing and fading.
  const ripple = (at, t0) => {
    const u = (t - t0) / 0.38;
    if (u < 0 || u > 1) return;
    const r = 7 + 20 * ease(u);
    const ring = document.createElement('div');
    ring.className = 'ripple';
    Object.assign(ring.style, {
      left: at.x - r + 'px', top: at.y - r + 'px', width: 2 * r + 'px', height: 2 * r + 'px',
      opacity: String(1 - u),
    });
    document.body.append(ring);
  };
  ripple(CLICK, T.press);
  ripple(INPUT, T.move2[1]);
</script>
</body>
</html>
